[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "npd"
version = "0.2.0"
description = "Non-convex polygon decomposition"
authors = [
    { name = "Georgy Skorobogatov", email = "skorobogatovgeorgy+github@gmail.com" },
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = []

[dependency-groups]
docs = [
    "Sphinx>=8.1.3,<9.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0"
]
dev = [
    "bump-my-version>=1.2.6,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    # fixed for easier way to reproduce across various machines
    "hypothesis==6.150.2",
    # keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "ruff==0.17.4",
    "mypy>=2.4.1,<3.0.0",
    "pre-commit>=4.0.0,<5.0.0"
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.coverage.run]
source = ["npd"]

[tool.pytest.ini_options]
addopts = "--verbose -s --hypothesis-profile=default"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]
